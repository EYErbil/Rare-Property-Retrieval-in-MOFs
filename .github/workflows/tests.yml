name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The regression tests exercise the fusion, nomination, split-materialization
      # and novelty logic on synthetic fixtures. They deliberately avoid torch,
      # pormake, rdkit and VASP, so the full research stack is not needed here.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn pytest

      - name: Run tests
        run: pytest tests/ -q
